apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.serviceName }}-canary
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "catalog-service.labels" . | nindent 4 }}

spec:
  type: ClusterIP

  selector:
    {{- include "catalog-service.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP