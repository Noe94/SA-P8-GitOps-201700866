global:
  namespace: sa-p8-dev
  logLevel: info
  imageTag: "1.0.0"
replicaCount: 2

image:
  repository: ghcr.io/noe94/p8-gateway
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

config:
  serviceName: gateway

  upstreams:
    catalog:
      host: catalog-service
      port: 3001

    inventory:
      host: inventory-service
      port: 3002

    orders:
      host: orders-service
      port: 3003

    shipping:
      host: shipping-service
      port: 3004

    auth:
      host: auth-service
      port: 3005

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  name: "gateway-sa"
  automount: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  startup:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 12

  readiness:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
