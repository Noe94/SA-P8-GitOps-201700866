{{- if .Values.networkPolicy.enabled }}
{{- range $service := .Values.networkPolicy.microservices }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argo-rollouts-to-{{ $service.name }}
  namespace: {{ $.Values.global.namespace | quote }}
  labels:
    {{- include "sa-platform.labels" $ | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $service.name | quote }}
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "argo-rollouts"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "argo-rollouts"
              app.kubernetes.io/component: "rollouts-controller"

      ports:
        - protocol: TCP
          port: {{ $service.port }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argo-rollouts-to-gateway
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "gateway"
      app.kubernetes.io/instance: {{ .Release.Name | quote }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "argo-rollouts"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "argo-rollouts"
              app.kubernetes.io/component: "rollouts-controller"

      ports:
        - protocol: TCP
          port: {{ .Values.ingress.gateway.servicePort }}
{{- end }}
