{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authorized-to-rabbitmq
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/instance: {{ .Release.Name }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: "orders-service"
              app.kubernetes.io/instance: {{ .Release.Name | quote }}

        - podSelector:
            matchLabels:
              app.kubernetes.io/name: "shipping-service"
              app.kubernetes.io/instance: {{ .Release.Name | quote }}

        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.futureCronJobs.summaryPublisher | quote }}

      ports:
        - protocol: TCP
          port: 5672
{{- end }}
