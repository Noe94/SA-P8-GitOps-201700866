apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "auth-service.fullname" . }}-analysis
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
spec:
  metrics:
    - name: health-check
      interval: 10s
      count: 3
      successCondition: "result == 'ok'"
      failureLimit: 1
      provider:
        web:
          url: "http://{{ include "auth-service.fullname" . }}:{{ .Values.service.port }}/api/health"
          timeoutSeconds: 5
          jsonPath: "{$.status}"
