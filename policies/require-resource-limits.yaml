apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: p8-require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU and memory limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions:
    - Deny

  evaluation:
    background:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  matchConditions:
    - name: p8-namespaces
      expression: >-
        object.metadata.namespace in ['sa-p8-dev', 'sa-p8-prod']

  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        variables.allContainers.all(c,
          has(c.resources)
          && has(c.resources.limits)
          && has(c.resources.limits.cpu)
          && has(c.resources.limits.memory)
        )
      message: >-
        Todos los contenedores deben definir limits.cpu y limits.memory.
