nameOverride: ""

global:
  namespace: sa-p8-dev
  environment: dev
  logLevel: info
  imageTag: "1.0.0"
  commonLabels:
    course: software-avanzado
    practice: p8
postgresql:
  image:
    registry: registry-1.docker.io
    repository: bitnami/postgresql
    digest: "sha256:b69d1fca390fb131639e86e820f248acfc5d911339dc884796f8009260c598d7"
  enabled: true
  fullnameOverride: postgresql

  serviceAccount:
    create: false
    name: postgresql-sa
    automountServiceAccountToken: false

  rbac:
    create: false
  auth:
    username: p8user
    database: p8db
    existingSecret: sa-platform-postgresql-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

  primary:
    networkPolicy:
      enabled: false

    persistence:
      enabled: true
      size: 1Gi
      accessModes:
        - ReadWriteOnce

    service:
      type: ClusterIP
      ports:
        postgresql: 5432

    initdb:
      scripts:
        01-schema.sql: |
          \connect p8db

          CREATE TABLE IF NOT EXISTS users (
              id BIGSERIAL PRIMARY KEY,
              name_encrypted TEXT NOT NULL,
              email_encrypted TEXT NOT NULL,
              email_hash VARCHAR(64) NOT NULL UNIQUE,
              password_hash TEXT NOT NULL,
              role VARCHAR(20) NOT NULL DEFAULT 'CLIENTE'
                  CHECK (role IN ('ADMIN', 'CLIENTE')),
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );

rabbitmq:
  enabled: true
  fullnameOverride: rabbitmq

  serviceAccount:
    create: false
    name: rabbitmq-sa
    automountServiceAccountToken: false

  rbac:
    create: false
  global:
    security:
      allowInsecureImages: true

  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
    pullPolicy: IfNotPresent

  auth:
    username: p8user
    existingPasswordSecret: sa-platform-rabbitmq-credentials
    existingSecretPasswordKey: rabbitmq-password
    existingErlangSecret: sa-platform-rabbitmq-credentials
    existingSecretErlangKey: rabbitmq-erlang-cookie
  configurationExistingSecret: sa-platform-rabbitmq-config

  persistence:
    enabled: true
    size: 1Gi
    accessModes:
      - ReadWriteOnce

  networkPolicy:
    enabled: false

ingress:
  enabled: true
  className: nginx
  host: ""
  path: /
  pathType: Prefix

  gateway:
    serviceName: gateway
    servicePort: 8080

networkPolicy:
  enabled: true

  ingressNamespace: ingress-nginx

  microservices:
    - name: catalog-service
      port: 3001

    - name: inventory-service
      port: 3002

    - name: orders-service
      port: 3003

    - name: shipping-service
      port: 3004

    - name: auth-service
      port: 3005

  futureCronJobs:
    databaseWriter: cronjob-db-writer
    summaryPublisher: cronjob-summary

cronjobs:
  dbWriter:
    enabled: true

    schedule: "*/2 * * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 2

    image:
      repository: ghcr.io/noe94/p8-cron-db-writer
      tag: ""
      pullPolicy: IfNotPresent

    config:
      dbHost: postgresql
      dbPort: "5432"
      dbName: p8db
      carnet: "201700866"

    databaseSecret:
      name: sa-platform-postgresql-credentials
      usernameKey: username
      passwordKey: password

    serviceAccount:
      automount: false

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi

  summary:
    enabled: true

    schedule: "*/10 * * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 2
    activeDeadlineSeconds: 180

    image:
      repository: ghcr.io/noe94/p8-cron-summary
      tag: ""
      pullPolicy: IfNotPresent

    config:
      dbHost: postgresql
      dbPort: "5432"
      dbName: p8db

      rabbitmqHost: rabbitmq
      rabbitmqPort: "5672"
      rabbitmqQueue: cron.summary

      consumerWaitSeconds: "90"

    databaseSecret:
      name: sa-platform-postgresql-credentials
      usernameKey: username
      passwordKey: password

    rabbitmqSecret:
      name: sa-platform-rabbitmq-credentials
      usernameKey: rabbitmq-username
      passwordKey: rabbitmq-password

    serviceAccount:
      automount: false

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      publisher:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 128Mi

      consumer:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 128Mi
