apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p8-secrets-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Noe94/SA-P8-GitOps-201700866.git
    targetRevision: main
    path: secrets/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
