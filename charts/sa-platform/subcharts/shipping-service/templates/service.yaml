apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "shipping-service.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "shipping-service.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
