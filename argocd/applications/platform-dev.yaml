apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p8-platform-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/Noe94/SA-P8-GitOps-201700866.git
    targetRevision: main
    path: charts/sa-platform
    helm:
      releaseName: sa-platform
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8-dev
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: postgresql
      jqPathExpressions:
        - '.metadata.annotations["autopilot.gke.io/resource-adjustment"]'
        - '.metadata.annotations["autopilot.gke.io/warden-version"]'
        - '.spec.template.spec.containers[]?.resources.limits["ephemeral-storage"]'
    - group: apps
      kind: StatefulSet
      name: rabbitmq
      jqPathExpressions:
        - '.metadata.annotations["autopilot.gke.io/resource-adjustment"]'
        - '.metadata.annotations["autopilot.gke.io/warden-version"]'
        - '.spec.template.spec.containers[]?.resources.limits["ephemeral-storage"]'
        - '.spec.template.spec.initContainers[]?.resources.limits["ephemeral-storage"]'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true

      - RespectIgnoreDifferences=true