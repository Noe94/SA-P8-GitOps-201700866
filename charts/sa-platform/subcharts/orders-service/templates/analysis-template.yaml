apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "orders-service.fullname" . }}-analysis
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "orders-service.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-hash
  metrics:
    - name: canary-readiness
      interval: 30s
      count: 3
      successCondition: "result[0] >= 1"
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.observabilidad.svc.cluster.local:9090
          query: |
            (
              sum(kube_pod_status_ready{
                namespace="{{ .Values.global.namespace }}",
                condition="true",
                pod=~".*{{ "{{args.canary-hash}}" }}.*"
              })
              /
              clamp_min(
                count(kube_pod_info{
                  namespace="{{ .Values.global.namespace }}",
                  pod=~".*{{ "{{args.canary-hash}}" }}.*"
                }),
                1
              )
            ) or vector(0)
