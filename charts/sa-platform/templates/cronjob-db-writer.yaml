{{- if .Values.cronjobs.dbWriter.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-db-writer
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/name: cronjob-db-writer
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: cronjob
    {{- include "sa-platform.labels" . | nindent 4 }}

spec:
  schedule: {{ .Values.cronjobs.dbWriter.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjobs.dbWriter.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjobs.dbWriter.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjobs.dbWriter.failedJobsHistoryLimit }}

  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjobs.dbWriter.backoffLimit }}

      template:
        metadata:
          labels:
            app.kubernetes.io/name: cronjob-db-writer
            app.kubernetes.io/instance: {{ .Release.Name | quote }}
            app.kubernetes.io/component: cronjob

        spec:
          serviceAccountName: cronjob-db-writer
          automountServiceAccountToken: {{ .Values.cronjobs.dbWriter.serviceAccount.automount }}
          restartPolicy: Never

          securityContext:
            {{- toYaml .Values.cronjobs.dbWriter.podSecurityContext | nindent 12 }}

          containers:
            - name: db-writer

              image: "{{ .Values.cronjobs.dbWriter.image.repository }}:{{ default .Values.global.imageTag .Values.cronjobs.dbWriter.image.tag }}"
              imagePullPolicy: {{ .Values.cronjobs.dbWriter.image.pullPolicy }}

              envFrom:
                - configMapRef:
                    name: cronjob-db-writer-config

              env:
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.cronjobs.dbWriter.databaseSecret.name }}
                      key: {{ .Values.cronjobs.dbWriter.databaseSecret.usernameKey }}

                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.cronjobs.dbWriter.databaseSecret.name }}
                      key: {{ .Values.cronjobs.dbWriter.databaseSecret.passwordKey }}

              securityContext:
                {{- toYaml .Values.cronjobs.dbWriter.containerSecurityContext | nindent 16 }}

              resources:
                {{- toYaml .Values.cronjobs.dbWriter.resources | nindent 16 }}
{{- end }}