{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}

spec:
  podSelector: {}

  policyTypes:
    - Ingress
{{- end }}
