global:
  namespace: sa-p8-dev
  logLevel: info
  imageTag: "1.0.0"
replicaCount: 2

image:
  repository: ghcr.io/noe94/p8-shipping
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 3004

service:
  type: ClusterIP
  port: 3004

config:
  serviceName: shipping-service
  rabbitmqHost: rabbitmq
  rabbitmqPort: "5672"
  rabbitmqQueue: orders.created

rabbitmqSecret:
  name: sa-platform-rabbitmq-credentials
  usernameKey: rabbitmq-username
  passwordKey: rabbitmq-password

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  name: "shipping-service-sa"
  automount: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  startup:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 12
  readiness:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
